name: dev

services:
  userbot:
    build: .
    container_name: ai-userbot-app-dev
    restart: unless-stopped
    command: ["python", "-m", "main"]
    env_file: .env.dev
    depends_on:
      - db  # Ждем запуска БД перед стартом userbot
    ports:
      - "8001:8000"

  db:
    image: postgres:16-alpine
    container_name: ai-userbot-db-dev
    restart: unless-stopped
    env_file: .env.dev
#    environment:
#      POSTGRES_USER: user
#      POSTGRES_PASSWORD: dixy12345
#      POSTGRES_DB: dixy
    ports:
      - "5433:5432"  # Опционально — только если нужен доступ снаружи
    volumes:
      - pgdata-dev:/var/lib/postgresql/data

volumes:
  pgdata-dev: